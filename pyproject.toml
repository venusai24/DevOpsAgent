[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airs"
version = "0.1.0"
description = "Reliability-First Cognitive Architecture for Enterprise Incident Response"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Orchestration
    "temporalio>=1.9.0",
    # Reasoning / Agent
    "langgraph>=0.4.0",
    # LLM Client (Groq via LiteLLM)
    "litellm>=1.60.0",
    # Vector DB
    "qdrant-client>=1.13.0",
    # Hallucination detection
    "bert-score>=0.3.13",
    # Serialization & config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # State store
    "redis[hiredis]>=5.2.0",
    # MCP Client
    "mcp>=1.9.0",
    # Math / stats
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Logging
    "structlog>=24.4.0",
    # YAML parsing
    "pyyaml>=6.0",
    # Token counting
    "tiktoken>=0.9.0",
    # HTTP (HuggingFace API)
    "httpx>=0.27.0",
    # GUI and Data processing
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    # Analytical SQL engine for large CSV files (too big for Excel)
    "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
