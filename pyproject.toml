[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airs"
version = "0.2.0"
description = "Autonomous SRE Diagnostic Agent"
requires-python = ">=3.12"

dependencies = [
    "polars>=0.20.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "ruptures>=1.1.9",
    "tiktoken>=0.7.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=0.1.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "psycopg>=3.1.19",
    "psycopg-pool>=3.2.2",
    "structlog>=24.1.0",
    "litellm>=1.35.0",
    "huggingface-hub>=0.23.0",
    "langsmith>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/csv_engine",
    "src/taip",
    "src/dsem",
    "src/diagnosis",
    "src/hitl",
    "src/orchestrator",
    "src/models",
    "src/config"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
