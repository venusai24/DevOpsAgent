# ═══════════════════════════════════════════════════════════════
# 11-airs-ml-sidecar.yaml
# Golden Blueprint — AIRS Isolation Forest Anomaly Detection Sidecar
#
# Deploys the ML sidecar as a standalone Deployment in the observability
# namespace. Isolated from the main AIRS agent process so model lifecycle
# (warm-up, retraining) does not interfere with incident response latency.
#
# Architecture:
#   PrometheusAnomalyEngine (airs-agent)
#     ─── HTTP GET /scores ──►  airs-ml-sidecar:8080
#                               │  Scrapes Prometheus every 15s
#                               │  Trains IsolationForest on rolling 8h window
#                               │  Exposes airs_if_anomaly_score Prometheus gauge
#                               ▼
#                           Prometheus ◄── PodMonitor scrapes /metrics
#
# Integration with PrometheusAnomalyEngine:
#   Set env var AIRS_ML_SIDECAR_URL=http://airs-ml-sidecar.observability.svc.cluster.local:8080
#   The engine queries /scores and creates composite Z-Score + IF anomaly signals.
#
# Resource sizing:
#   scikit-learn IsolationForest on 2000 samples × 9 features uses ~50MB RAM.
#   CPU spikes during retraining (~50ms per cycle). Limits set conservatively.
# ═══════════════════════════════════════════════════════════════

# ── Namespace (already created by 00-namespace-priorities.yaml) ──
# The observability namespace is assumed to exist.

---
# ── ServiceAccount ─────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airs-ml-sidecar
  namespace: observe
  labels:
    app.kubernetes.io/name: airs-ml-sidecar
    app.kubernetes.io/component: anomaly-detection
    app.kubernetes.io/part-of: golden-blueprint

---
# ── Deployment ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airs-ml-sidecar
  namespace: observe
  labels:
    app.kubernetes.io/name: airs-ml-sidecar
    app.kubernetes.io/component: anomaly-detection
    app.kubernetes.io/part-of: golden-blueprint
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airs-ml-sidecar
  strategy:
    type: Recreate    # Only 1 replica; RollingUpdate would briefly double memory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airs-ml-sidecar
        app.kubernetes.io/component: anomaly-detection
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Force Prometheus to scrape the /metrics endpoint
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: airs-ml-sidecar
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: airs-ml-sidecar
          # TODO: Update this image tag to your registry + built image.
          # Build: docker build -t airs-ml-sidecar:1.0.0 ./airs_ml_sidecar/
          # Push:  docker tag airs-ml-sidecar:1.0.0 <registry>/airs-ml-sidecar:1.0.0
          image: airs-ml-sidecar:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PROMETHEUS_URL
              # Prometheus in the monitoring namespace — adjust if different
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: TARGET_NAMESPACE
              # The namespace containing the services being monitored
              value: "default"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "15"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Sidecar is 'not ready' during model warm-up (~50 min with 15s interval).
            # During this period, Kubernetes will not route traffic to this pod,
            # and the PrometheusAnomalyEngine will use Z-Scores as the sole signal.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Prefer to schedule on a different node from the AIRS agent
      # to avoid resource contention during retraining spikes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: airs-agent
                topologyKey: kubernetes.io/hostname

---
# ── Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: airs-ml-sidecar
  namespace: observe
  labels:
    app.kubernetes.io/name: airs-ml-sidecar
    app.kubernetes.io/component: anomaly-detection
    app.kubernetes.io/part-of: golden-blueprint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: airs-ml-sidecar
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# ── PodMonitor (Prometheus Operator) ───────────────────────────
# Instructs the Prometheus Operator to scrape the /metrics endpoint
# on the sidecar pod. This makes airs_if_anomaly_score available as
# a native Prometheus metric for alerting and Grafana dashboards.
#
# Requires: prometheus-operator CRDs installed in the cluster.
# If not using prometheus-operator, use the annotation-based scraping
# configured in the Deployment pod template above instead.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: airs-ml-sidecar
  namespace: observe
  labels:
    app.kubernetes.io/name: airs-ml-sidecar
    app.kubernetes.io/part-of: golden-blueprint
    # This label must match the Prometheus Operator's podMonitorSelector
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: airs-ml-sidecar
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
