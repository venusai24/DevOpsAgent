services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: airs-postgres
    environment:
      POSTGRES_USER: airs_user
      POSTGRES_PASSWORD: airs_password
      POSTGRES_DB: airs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airs_user -d airs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
